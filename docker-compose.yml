version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite-data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///data/quality_hub.db
      # 项目管理联动：值由部署环境（Jenkins 凭据）传入，这里只透传变量名
      - PM_BASE
      - PM_TOKEN
      - PM_WEBHOOK_SECRET
      - QH_PUBLIC_URL
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
