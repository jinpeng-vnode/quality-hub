services:
  gateway:
    image: nginx:alpine
    ports:
      - 5400:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    ports: !override []
    # 接入项目管理所在的 docker 网络，后端用 http://fleet-pm:8930 访问项目管理
    networks:
      - default
      - fleet_default

  frontend:
    ports: !override []

networks:
  fleet_default:
    external: true
